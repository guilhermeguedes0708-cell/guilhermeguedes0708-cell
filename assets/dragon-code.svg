<svg width="800" height="300"
     viewBox="0 0 800 300"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Brilho das esferas -->
  <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Clarão -->
  <radialGradient id="flashGradient">
    <stop offset="0%" stop-color="white"/>
    <stop offset="30%" stop-color="#fff59d"/>
    <stop offset="65%" stop-color="#ffb300" stop-opacity=".7"/>
    <stop offset="100%" stop-color="#ff9800" stop-opacity="0"/>
  </radialGradient>

</defs>

<style>

  /* =========================
     DRAGON BALLS
     ========================= */

  .ball {
    fill: #ff9800;
    stroke: #ffd54f;
    stroke-width: 3;
  }

  .star {
    fill: #c62828;
    font-size: 23px;
    text-anchor: middle;
  }

  .dragonball {
    opacity: 0;
    transform-box: view-box;
    transform-origin: center;
  }


  /* =========================
     ANIMAÇÕES INDIVIDUAIS
     ========================= */

  .b1 {
    animation: move1 14s infinite;
  }

  .b2 {
    animation: move2 14s infinite;
  }

  .b3 {
    animation: move3 14s infinite;
  }

  .b4 {
    animation: move4 14s infinite;
  }

  .b5 {
    animation: move5 14s infinite;
  }

  .b6 {
    animation: move6 14s infinite;
  }

  .b7 {
    animation: move7 14s infinite;
  }


  /* 1 */

  @keyframes move1 {

    0% {
      opacity:0;
      transform:scale(0);
    }

    6% {
      opacity:1;
      transform:scale(1.15);
    }

    9%,55% {
      opacity:1;
      transform:scale(1);
      filter:none;
    }

    60% {
      filter:url(#glow);
    }

    68% {
      transform:translate(280px,70px) scale(.65);
      filter:url(#glow);
      opacity:1;
    }

    75% {
      opacity:0;
    }

    100% {
      opacity:0;
    }
  }


  /* 2 */

  @keyframes move2 {

    0%,6% {
      opacity:0;
      transform:scale(0);
    }

    12% {
      opacity:1;
      transform:scale(1.15);
    }

    15%,55% {
      opacity:1;
      transform:scale(1);
      filter:none;
    }

    60% {
      filter:url(#glow);
    }

    68% {
      transform:translate(200px,100px) scale(.65);
      filter:url(#glow);
      opacity:1;
    }

    75% {
      opacity:0;
    }

    100% {
      opacity:0;
    }
  }


  /* 3 */

  @keyframes move3 {

    0%,12% {
      opacity:0;
      transform:scale(0);
    }

    18% {
      opacity:1;
      transform:scale(1.15);
    }

    21%,55% {
      opacity:1;
      transform:scale(1);
      filter:none;
    }

    60% {
      filter:url(#glow);
    }

    68% {
      transform:translate(110px,115px) scale(.65);
      filter:url(#glow);
      opacity:1;
    }

    75% {
      opacity:0;
    }

    100% {
      opacity:0;
    }
  }


  /* 4 */

  @keyframes move4 {

    0%,18% {
      opacity:0;
      transform:scale(0);
    }

    24% {
      opacity:1;
      transform:scale(1.15);
    }

    27%,55% {
      opacity:1;
      transform:scale(1);
      filter:none;
    }

    60% {
      filter:url(#glow);
    }

    68% {
      transform:translate(5px,120px) scale(.65);
      filter:url(#glow);
      opacity:1;
    }

    75% {
      opacity:0;
    }

    100% {
      opacity:0;
    }
  }


  /* 5 */

  @keyframes move5 {

    0%,24% {
      opacity:0;
      transform:scale(0);
    }

    30% {
      opacity:1;
      transform:scale(1.15);
    }

    33%,55% {
      opacity:1;
      transform:scale(1);
      filter:none;
    }

    60% {
      filter:url(#glow);
    }

    68% {
      transform:translate(-100px,115px) scale(.65);
      filter:url(#glow);
      opacity:1;
    }

    75% {
      opacity:0;
    }

    100% {
      opacity:0;
    }
  }


  /* 6 */

  @keyframes move6 {

    0%,30% {
      opacity:0;
      transform:scale(0);
    }

    36% {
      opacity:1;
      transform:scale(1.15);
    }

    39%,55% {
      opacity:1;
      transform:scale(1);
      filter:none;
    }

    60% {
      filter:url(#glow);
    }

    68% {
      transform:translate(-200px,100px) scale(.65);
      filter:url(#glow);
      opacity:1;
    }

    75% {
      opacity:0;
    }

    100% {
      opacity:0;
    }
  }


  /* 7 */

  @keyframes move7 {

    0%,36% {
      opacity:0;
      transform:scale(0);
    }

    42% {
      opacity:1;
      transform:scale(1.15);
    }

    45%,55% {
      opacity:1;
      transform:scale(1);
      filter:none;
    }

    60% {
      filter:url(#glow);
    }

    68% {
      transform:translate(-280px,70px) scale(.65);
      filter:url(#glow);
      opacity:1;
    }

    75% {
      opacity:0;
    }

    100% {
      opacity:0;
    }
  }


  /* =========================
     CLARÃO
     ========================= */

  .flash {
    opacity:0;
    animation:flash 14s infinite;
  }

  @keyframes flash {

    0%,68% {
      opacity:0;
      r:0;
    }

    72% {
      opacity:1;
      r:190;
    }

    78% {
      opacity:0;
      r:300;
    }

    100% {
      opacity:0;
    }
  }


  /* =========================
     DRAGÃO
     ========================= */

  .dragon {
    opacity:0;
    transform-origin:400px 145px;
    animation:dragon 14s infinite;
  }

  @keyframes dragon {

    0%,74% {
      opacity:0;
      transform:scale(.7);
    }

    80% {
      opacity:.45;
      transform:scale(1);
    }

    94% {
      opacity:.45;
      transform:scale(1.03);
    }

    100% {
      opacity:0;
      transform:scale(1.08);
    }
  }


  /* =========================
     TEXTO
     ========================= */

  .message {
    opacity:0;
    text-anchor:middle;
    font-family:monospace;
    animation:message 14s infinite;
  }

  @keyframes message {

    0%,78% {
      opacity:0;
    }

    83%,95% {
      opacity:1;
    }

    100% {
      opacity:0;
    }
  }

  .title {
    fill:#66bb6a;
    font-size:30px;
    font-weight:bold;
  }

  .terminal {
    fill:#8bc34a;
    font-size:16px;
  }

</style>


